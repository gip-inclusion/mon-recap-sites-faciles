name: Check latest tag

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  UPSTREAM_URL: https://github.com/numerique-gouv/sites-conformes
  PROD_BRANCH: production


jobs:
  check-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # push branches and tags
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream --tags --force

      - name: Check for new tag
        id: tag
        run: |
          current=$(git describe "$PROD_BRANCH" --tags --abbrev=0)
          latest=$(git tag --sort=-version:refname | head -n 1)
          echo "Production : $current / Upstream : $latest"

          if [ "$current" = "$latest" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
            echo "current=$current" >> "$GITHUB_OUTPUT"
          fi
    
      - name: Create pull request
        if: steps.tag.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}   # ou ${{ secrets.PAT }}
          LATEST: ${{ steps.tag.outputs.latest }}
          CURRENT: ${{ steps.tag.outputs.current }}
        run: |
          branch="update/$LATEST"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists, skipping branch creation"
          else
            git switch -c "$branch" "$LATEST"
            git push origin "$branch"
          fi

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base production --state open --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $branch, nothing to do."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base production \
            --head "$branch" \
            --title "Mise à jour de $CURRENT vers $LATEST" \
            --body "Nouveau tag upstream détecté.

          PR générée automatiquement par $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          
          Voir les nouveautés : https://github.com/numerique-gouv/sites-conformes/releases"